<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Moderation - WhatsCR?</title>
  <link rel="icon" type="image/x-icon" href="Immagini/favicons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="Immagini/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="Immagini/favicons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="Immagini/favicons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0097b2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="legal-body">

  <header class="legal-header">
    <div class="legal-header-inner">
      <a href="index.html" class="legal-brand" title="WhatsCR?">
        <img src="Immagini/brand/Logo.webp" alt="Logo WhatsCR" class="brand-icon">
        <img src="Immagini/brand/scrittawhatscr.webp" alt="WhatsCR?" class="brand-text">
      </a>
      <div style="display: flex; align-items: center; gap: 14px;">
        <span id="admin-user-badge" style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; background: #fee2e2; color: #991b1b; font-size: 0.8rem; font-weight: 700; border-radius: var(--radius-full);">
          <i class="fa-solid fa-shield-halved"></i> Admin Panel
        </span>
        <a href="index.html" class="legal-back-link">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Home</span>
        </a>
      </div>
    </div>
  </header>

  <main class="legal-main" style="max-width: 900px; margin: 40px auto; padding: 0 20px;">
    
    <div id="auth-guard" style="display: none; text-align: center; padding: 60px 20px; background: #ffffff; border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow-sm);">
      <div style="width: 60px; height: 60px; min-width: 60px; min-height: 60px; max-width: 60px; max-height: 60px; flex-shrink: 0; aspect-ratio: 1 / 1; border-radius: 50%; background: #fee2e2; color: #dc2626; display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 16px;">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 style="font-size: 1.4rem; font-weight: 800; color: var(--text-main); margin-bottom: 8px;">Access Restricted</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px;">This moderation panel is reserved for administrators only.</p>
      <a href="login.html" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 8px;">
        <i class="fa-solid fa-right-to-bracket"></i> Log In as Admin
      </a>
    </div>

    <div id="admin-dashboard" style="display: none;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 14px;">
        <div>
          <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main); margin-bottom: 4px;">Track Management</h1>
          <p style="color: var(--text-muted); font-size: 0.9rem;">Review pending tracks or manage and remove published music from the platform.</p>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <button id="refresh-btn" class="btn" style="background: var(--bg-muted); border: 1px solid var(--border); font-size: 0.85rem; font-weight: 600; padding: 8px 16px; border-radius: var(--radius-full); cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
            <i class="fa-solid fa-rotate-right"></i> Refresh
          </button>
        </div>
      </div>

      <div style="display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px;">
        <button id="tab-pending" class="admin-tab active" style="background: var(--primary); color: #ffffff; border: none; border-radius: var(--radius-full); padding: 7px 18px; font-size: 0.86rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s ease;">
          <i class="fa-solid fa-clock"></i> Pending Review (<span id="pending-count">0</span>)
        </button>
        <button id="tab-published" class="admin-tab" style="background: transparent; color: var(--text-muted); border: 1px solid var(--border); border-radius: var(--radius-full); padding: 7px 18px; font-size: 0.86rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s ease;">
          <i class="fa-solid fa-music"></i> Published Tracks (<span id="published-count">0</span>)
        </button>
      </div>

      <div id="admin-alert" style="display: none; padding: 12px 16px; border-radius: 12px; font-size: 0.88rem; margin-bottom: 20px; line-height: 1.4;"></div>

      <div id="pending-list" style="display: flex; flex-direction: column; gap: 16px;">
        <div style="text-align: center; padding: 40px; color: var(--text-muted);">
          <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 1.5rem; color: var(--primary);"></i>
          <p style="margin-top: 10px; font-size: 0.9rem;">Loading review queue...</p>
        </div>
      </div>
    </div>

  </main>

  <script src="js/admin-page.js"></script>

</body>
</html>
